# teleport-cluster Helm values.
#
# This file is a template rendered with `envsubst` before use. Only the variables
# listed below are substituted (envsubst is always invoked with an explicit
# variable list so that nothing else in the file can be mangled):
#
#   TELEPORT_CLUSTER_NAME  the cluster name / proxy public address. IMMUTABLE.
#   ACME_EMAIL             Let's Encrypt registration contact.
#   ACME_URI               empty for the LE production directory, or the LE
#                          staging directory when ACME_USE_STAGING=true.
#
# See SPEC.md Appendix A.

chartMode: standalone

# Immutable for the life of the cluster: changing it invalidates the host CAs and
# every issued certificate. The only way to change it is destroy.yml.
clusterName: "${TELEPORT_CLUSTER_NAME}"

enterprise: true
# The chart looks for a Secret with this name; the file key inside it MUST be
# `license.pem` (deploy.yml creates it with --from-file=license.pem=...).
licenseSecretName: license

# Let's Encrypt via the TLS-ALPN-01 challenge on :443. This requires the Service
# LoadBalancer to be an L4 / TCP passthrough LB -- an L7 LB that terminates TLS
# makes ACME fail. See docs/runbook.md.
acme: true
acmeEmail: "${ACME_EMAIL}"
# Empty string selects the Let's Encrypt production directory (chart default).
acmeURI: "${ACME_URI}"

# TLS routing: everything multiplexed on the single proxy port 443.
proxyListenerMode: multiplex

authentication:
  type: local
  localAuth: true
  secondFactors: ["otp", "webauthn"]

persistence:
  enabled: true
  volumeSize: 10Gi

service:
  type: LoadBalancer

highAvailability:
  # REQUIRED: ACME in this chart is single-pod only. Do not raise this without
  # also switching away from `acme` to an externally managed certificate.
  replicaCount: 1

log:
  level: INFO
  # JSON so the failure dumps in §9.5 can be filtered with jq.
  format: json
  output: stderr
  extraFields: ["timestamp", "level", "component", "caller"]
