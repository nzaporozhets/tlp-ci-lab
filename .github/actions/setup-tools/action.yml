name: Verify runner tooling
description: >-
  Assert that the tools pinned in tool-versions.env are present on the
  self-hosted runner. This action VERIFIES ONLY -- it never installs anything.
  The runner is provisioned once by terraform/runner-bootstrap, which installs the
  same versions from the same file, so a mismatch here means the runner has
  drifted and should be re-provisioned rather than patched from a workflow.

inputs:
  versions-file:
    description: Path to the pinned tool versions file, relative to the workspace.
    required: false
    default: tool-versions.env
  require-teleport-tools:
    description: >-
      Fail if tsh/tctl are missing. They are optional: scripts/tctl.sh runs tctl
      inside the auth pod, so CI does not need a local copy.
    required: false
    default: "false"

outputs:
  kubectl-version:
    description: kubectl client version found on the runner.
    value: ${{ steps.verify.outputs.kubectl-version }}
  helm-version:
    description: helm version found on the runner.
    value: ${{ steps.verify.outputs.helm-version }}
  terraform-version:
    description: terraform version found on the runner.
    value: ${{ steps.verify.outputs.terraform-version }}
  aws-version:
    description: AWS CLI version found on the runner.
    value: ${{ steps.verify.outputs.aws-version }}

runs:
  using: composite
  steps:
    - id: verify
      shell: bash
      env:
        VERSIONS_FILE: ${{ inputs.versions-file }}
        REQUIRE_TELEPORT_TOOLS: ${{ inputs.require-teleport-tools }}
      run: |
        set -euo pipefail

        problems=0
        note() { printf '  %s\n' "$*"; }
        bad() {
          echo "::error title=setup-tools::$1"
          problems=$((problems + 1))
        }

        versions_path="$GITHUB_WORKSPACE/$VERSIONS_FILE"
        if [ ! -r "$versions_path" ]; then
          echo "::error title=setup-tools::cannot read $versions_path. Did actions/checkout run first?"
          exit 1
        fi

        # Only KEY=value lines; nothing is executed from the file.
        while IFS='=' read -r key value; do
          case "$key" in
            KUBECTL_VERSION)   want_kubectl="$value" ;;
            HELM_VERSION)      want_helm="$value" ;;
            TERRAFORM_VERSION) want_terraform="$value" ;;
            AWSCLI_VERSION)    want_awscli="$value" ;;
          esac
        done < <(grep -E '^[A-Z_]+=' "$versions_path")

        : "${want_kubectl:?KUBECTL_VERSION missing from $VERSIONS_FILE}"
        : "${want_helm:?HELM_VERSION missing from $VERSIONS_FILE}"
        : "${want_terraform:?TERRAFORM_VERSION missing from $VERSIONS_FILE}"
        : "${want_awscli:?AWSCLI_VERSION missing from $VERSIONS_FILE}"

        # $1 <= $2 ?
        version_ge() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ]; }
        major() { printf '%s' "${1%%.*}"; }
        minor() { local v="${1#*.}"; printf '%s' "${v%%.*}"; }

        missing() {
          bad "'$1' is not on PATH on this runner. Re-provision the runner with terraform/runner-bootstrap (it installs the versions in $VERSIONS_FILE), or install it by hand over SSM. This action deliberately does not install tools."
        }

        # ------------------------------------------------------------------ kubectl
        if ! command -v kubectl >/dev/null 2>&1; then
          missing kubectl
          got_kubectl=""
        else
          got_kubectl="$(kubectl version --client -o json 2>/dev/null | jq -r '.clientVersion.gitVersion // empty' | sed 's/^v//')"
          got_kubectl="${got_kubectl:-$(kubectl version --client 2>/dev/null | sed -n 's/.*GitVersion:"v\([^"]*\)".*/\1/p')}"
          note "kubectl: ${got_kubectl:-unknown} (pinned ${want_kubectl})"
          if [ -z "$got_kubectl" ]; then
            bad "could not determine the kubectl client version"
          elif [ "$(major "$got_kubectl")" != "$(major "$want_kubectl")" ]; then
            bad "kubectl major version mismatch: found $got_kubectl, pinned $want_kubectl"
          else
            skew=$(( $(minor "$got_kubectl") - $(minor "$want_kubectl") ))
            if [ "${skew#-}" -gt 1 ]; then
              bad "kubectl minor version skew is greater than 1: found $got_kubectl, pinned $want_kubectl"
            fi
          fi
        fi

        # --------------------------------------------------------------------- helm
        if ! command -v helm >/dev/null 2>&1; then
          missing helm
          got_helm=""
        else
          got_helm="$(helm version --template '{{ .Version }}' 2>/dev/null | sed 's/^v//')"
          note "helm: ${got_helm:-unknown} (pinned ${want_helm})"
          if [ "$(major "${got_helm:-0}")" != "3" ]; then
            bad "helm 3.x is required; found '${got_helm:-unknown}'"
          fi
        fi

        # ---------------------------------------------------------------- terraform
        if ! command -v terraform >/dev/null 2>&1; then
          missing terraform
          got_terraform=""
        else
          got_terraform="$(terraform version -json 2>/dev/null | jq -r '.terraform_version // empty')"
          note "terraform: ${got_terraform:-unknown} (pinned ${want_terraform})"
          if [ -z "$got_terraform" ]; then
            bad "could not determine the terraform version"
          elif ! version_ge "$got_terraform" "1.10.0"; then
            bad "terraform >= 1.10.0 is required for S3 backend native locking (use_lockfile); found $got_terraform"
          fi
        fi

        # ---------------------------------------------------------------- aws cli v2
        if ! command -v aws >/dev/null 2>&1; then
          missing aws
          got_aws=""
        else
          got_aws="$(aws --version 2>&1 | sed -n 's|^aws-cli/\([^ ]*\).*|\1|p')"
          note "aws: ${got_aws:-unknown} (pinned ${want_awscli})"
          if [ "$(major "${got_aws:-0}")" != "2" ]; then
            bad "AWS CLI v2 is required; found '${got_aws:-unknown}'"
          fi
        fi

        # ------------------------------------------------------------------- others
        for tool in jq git curl envsubst openssl base64; do
          if command -v "$tool" >/dev/null 2>&1; then
            note "$tool: present"
          else
            missing "$tool"
          fi
        done

        # envsubst comes from gettext and is easy to miss.
        if ! command -v envsubst >/dev/null 2>&1; then
          note "hint: envsubst is provided by the 'gettext' package"
        fi

        # ------------------------------------------------------- optional tctl/tsh
        for tool in tctl tsh; do
          if command -v "$tool" >/dev/null 2>&1; then
            note "$tool: present ($($tool version 2>/dev/null | head -n1))"
          elif [ "$REQUIRE_TELEPORT_TOOLS" = "true" ]; then
            missing "$tool"
          else
            echo "::notice title=setup-tools::$tool is not installed on the runner. That is fine: scripts/tctl.sh runs tctl inside the auth pod."
          fi
        done

        {
          echo "kubectl-version=${got_kubectl:-}"
          echo "helm-version=${got_helm:-}"
          echo "terraform-version=${got_terraform:-}"
          echo "aws-version=${got_aws:-}"
        } >>"$GITHUB_OUTPUT"

        if [ "$problems" -gt 0 ]; then
          echo "::error title=setup-tools::$problems tool problem(s) found on this runner. See docs/runbook.md 'Runner tooling drift'."
          exit 1
        fi
        echo "all pinned tools present"
