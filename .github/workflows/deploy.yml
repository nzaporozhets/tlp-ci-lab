name: Deploy Teleport cluster on K8s
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render and validate only -- do not install'
        type: boolean
        default: false
      deploy_env:
        description: 'Name of the environment to deploy. Should match the directory name in configs/'
        required: true
        type: string
      mwi_enabled:
        description: 'Configure tbot for this GHA pipeline from the new cluster'
        type: boolean
        default: false
concurrency:
  group: teleport-cluster
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: [self-hosted, linux, teleport] # need to check tbot/k8s access path before switching to gh runner
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_ENV: ${{ inputs.deploy_env }}  
    steps:
      - name: Check out this repository onto the runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Export required variables
        run: cat "${GITHUB_WORKSPACE}/configs/${DEPLOY_ENV}/gh_vars.env" >> "$GITHUB_ENV"

      - name: Check that environment for deployment is configured
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_ENV}" ]; then
            echo "The repository var to select the environment to deploy is missing. (set "DEPLOY_ENV" in the configs/[env name]/gh_vars.yaml if running on push.)"
            exit 1;
          fi

      - name: Check the required env variables are set
        run: |
          set -euo pipefail
          missing=()
          for name in TELEPORT_VERSION K8S_NAMESPACE ; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "These env variables are empty or not set: ${missing[*]}. Add to the configs/${DEPLOY_ENV}/gh_vars.yaml"
            exit 1
          fi

      - name: Verify Helm config for the region is present
        run: |
          set -euo pipefail
          if [ ! -f "${GITHUB_WORKSPACE}/configs/${DEPLOY_ENV}/helm/teleport-cluster-values.yaml" ]; then
            echo "Helm config for the region seems to be missing. Please create the teleport-cluster-values.yaml file in /[env name]/helm/ "
            exit 1
          fi          

      - name: Check the required command-line tools are installed
        run: |
          set -euo pipefail
          missing=()
          for tool in kubectl helm jq openssl envsubst curl base64 tbot; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing+=("$tool")
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Not found on this runner's PATH: ${missing[*]}"
            echo "Re-run runner/install-runner.sh on the runner VM, which installs all of them."
            echo "(envsubst is part of the 'gettext' package; the others are their own packages.)"
            echo "::error title=Missing tools on the runner::${missing[*]} -- see runner/install-runner.sh"
            exit 1
          fi

          # Print versions: when something behaves oddly later, the first
          # question is always "which version?", and the answer is now in the log.
          kubectl version --client
          helm version
          echo "jq      $(jq --version)"
          openssl version

      - name: Run tbot to get kubeconfig
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          envsubst '${RUNNER_TEMP}' < tbot.yaml > "${RUNNER_TEMP}/tbot.yaml"
          tbot start --oneshot -c "${RUNNER_TEMP}/tbot.yaml"
          echo "KUBECONFIG=${RUNNER_TEMP}/machine-id/kubeconfig.yaml" >> "$GITHUB_ENV"
        
      - name: Verify access to k8s cluster and resources
        run: |
          set -euo pipefail
          if ! kubectl cluster-info; then
            echo "Connecting to k8s failed, verify tbot"
            exit 1
          fi

          if ! kubectl get ns ${K8S_NAMESPACE} -o json | jq .status.phase -r; then
            echo "Namespace ${K8S_NAMESPACE} doesn't seem to exist is the cluster or you lack permissions to view it"
            exit 1
          fi

          if ! kubectl get secret teleport-tls -n "${K8S_NAMESPACE}" >/dev/null 2>&1; then
            echo "TLS secret teleport-tls is missing from the ${K8S_NAMESPACE}. Please create it and rerun"
            exit 1
          fi

          if ! kubectl get secret teleport-license -n "${K8S_NAMESPACE}" >/dev/null 2>&1; then
            echo "Teleport license secret teleport-license is missing from the ${K8S_NAMESPACE}. Please create it and rerun"
            exit 1
          fi


      - name: Download helm charts
        run: | 
          set -euo pipefail
          helm repo add teleport https://charts.releases.teleport.dev
          helm repo update

      #TODO: lint was actually broken and never ran, need to deal with it later
      # - name: Helm lint and verify
      #   run: |
      #     set -eou pipefail
      #     helm lint chart/teleport-cluster \
      #     --values "${GITHUB_WORKSPACE}/configs/${DEPLOY_ENV}/helm/teleport-cluster-values.yaml" \
      #     --namespace "${K8S_NAMESPACE}"

      - name: Stop dryrun
        if: ${{ inputs.dry_run }}
        run: |
          set -eou pipefail
          echo "This was a dry run."
          {
            echo "## Dry run completed"
            echo ""
            echo "All preflight checks passed:"
            echo "Required software is present;"
            echo "tbot ran successfully;"
            echo "K8s access confirmed, required ns and secrets present;"
            echo "Config is present;"
            echo "Helm lint successful."
          } >> "$GITHUB_STEP_SUMMARY"

          # Everything below should check for dry run
      - name: Install/upgrade Teleport cluster Helm chart   
        if: ${{ !inputs.dry_run }}    
        run: |
          set -euo pipefail
          helm upgrade --install teleport-cluster teleport/teleport-cluster \
          --version "${TELEPORT_VERSION}" \
          --values "${GITHUB_WORKSPACE}/configs/${DEPLOY_ENV}/helm/teleport-cluster-values.yaml" \
          --namespace "${K8S_NAMESPACE}" \
          --wait \
          --timeout 15m
#todo: configure proper checks for pods and svc
      - name: Check Auth and Proxy pods status
        if: ${{ !inputs.dry_run }}    
        run: |
          set -euo pipefail
          kubectl get po -n ${K8S_NAMESPACE}

      - name: Get the LB data to setup DNS
        if: ${{ !inputs.dry_run }}    
        run: |
          set -euo pipefail
          kubectl get services/teleport-cluster -n ${K8S_NAMESPACE}


#k8s role is probably not needed for this bot, as create/delete would create ouroboros-type situations, only update would work. 
#TODO: Role has no update on roles, so future RBAC pipeline needs to have checks for reruns. Or maybe add JIT? 
#TODO: config template should be just pushed to the repo when run, changes are trivial. Or generate in each pipeline?
      - name: Create and configure bot user 
        if: ${{ !inputs.dry_run && inputs.mwi_enabled }}
        run: | 
          set -eo pipefail
          echo "Creating a Role for bot"         
          kubectl exec -i -n "${K8S_NAMESPACE}" deploy/teleport-cluster-auth -- tctl create -f - <<'EOF'
          kind: role
          metadata:
            name: gha-ci-bot
          version: v7
          spec:
            allow:
              rules:
                - resources: [role]
                  verbs: [list, create, read]
                - resources: [auth_connector]
                  verbs: [list, create, read, update]
            deny: {}
          EOF

          echo "Creating a GitHub-type join token"
          kubectl exec -i -n "${K8S_NAMESPACE}" deploy/teleport-cluster-auth -- tctl create -f - <<EOF
          kind: token
          version: v2
          metadata:
            name: gha-bot-token
          spec:
            join_method: github
            roles:
            - Bot
            bot_name: gha-bot
            github:
              allow:
              - repository: "${{ github.repository }}"
          EOF

          echo "Creating a bot user"
          kubectl exec -n "${K8S_NAMESPACE}" deploy/teleport-cluster-auth -- tctl create -f - <<EOF
          kind: bot
          version: v1
          metadata:
            name: gha-bot
          spec:
            roles:
              - gha-ci-bot
          EOF

          echo "The following resources have been created:"
          echo "- Teleport role gha-ci-bot to allow bot create and edit roles and SSO auth connectors;"
          echo "- Teleport GitHub join token gha-bot-token and a bot user gha-bot "
          echo "Please copy a bot config template from templates/tbot.yaml to configs/${DEPLOY_ENV}/teleport/mwi to use this bot with teleport configuration pipelines."
        




      

