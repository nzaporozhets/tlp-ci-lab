name: lint

# The ONLY workflow in this repository that may be triggered by `pull_request`.
#
# It runs on a GitHub-hosted runner, declares no `environment:`, and is given no
# secrets, so untrusted pull-request code never reaches the self-hosted runner, the
# IAM instance profile, or the kubeconfig (SPEC.md §10.1). The
# "trigger rules" job below enforces that property mechanically for every workflow
# in .github/workflows, including this one.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Deliberately no secrets and no `environment:` anywhere in this workflow.
  HELM_REPO_URL: https://charts.releases.teleport.dev
  ACTIONLINT_VERSION: 1.7.7
  ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757

jobs:
  # ---------------------------------------------------------------------------
  # SPEC.md §10.1: no workflow that targets the self-hosted runner or the
  # teleport-ci environment may be triggered by pull_request / pull_request_target.
  trigger-rules:
    name: trigger rules (self-hosted runner safety)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Assert no privileged workflow is PR-triggered
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          FORBIDDEN = {"pull_request", "pull_request_target"}
          WORKFLOWS = sorted(pathlib.Path(".github/workflows").glob("*.y*ml"))
          if not WORKFLOWS:
              sys.exit("no workflow files found -- refusing to pass vacuously")

          problems = []

          def triggers(doc):
              # PyYAML resolves the bare key `on` to the boolean True.
              raw = doc.get("on", doc.get(True))
              if raw is None:
                  return set()
              if isinstance(raw, str):
                  return {raw}
              if isinstance(raw, list):
                  return set(raw)
              if isinstance(raw, dict):
                  return set(raw)
              return set()

          def privileged(doc):
              """Does any job here touch the self-hosted runner or the environment?"""
              reasons = []
              for job_id, job in (doc.get("jobs") or {}).items():
                  if not isinstance(job, dict):
                      continue
                  runs_on = job.get("runs-on")
                  flat = []
                  if isinstance(runs_on, str):
                      flat = [runs_on]
                  elif isinstance(runs_on, list):
                      flat = [str(x) for x in runs_on]
                  elif isinstance(runs_on, dict):
                      flat = [str(x) for x in (runs_on.get("labels") or [])]
                      group = runs_on.get("group")
                      if group:
                          flat.append(str(group))
                  if any("self-hosted" in x for x in flat):
                      reasons.append(f"job '{job_id}' runs on a self-hosted runner")
                  if job.get("environment"):
                      reasons.append(f"job '{job_id}' uses environment {job['environment']!r}")
                  if job.get("secrets"):
                      reasons.append(f"job '{job_id}' forwards secrets to a reusable workflow")
                  uses = job.get("uses")
                  if isinstance(uses, str) and uses.startswith("./.github/workflows/"):
                      reasons.append(f"job '{job_id}' calls privileged reusable workflow {uses}")
              return reasons

          for path in WORKFLOWS:
              doc = yaml.safe_load(path.read_text()) or {}
              found = triggers(doc) & FORBIDDEN
              reasons = privileged(doc)
              if found and reasons:
                  problems.append(
                      f"{path}: triggered by {sorted(found)} AND privileged: "
                      + "; ".join(reasons)
                  )
              print(f"{path}: triggers={sorted(triggers(doc))} privileged={bool(reasons)}")

          # lint.yml itself must stay unprivileged.
          lint = pathlib.Path(".github/workflows/lint.yml")
          if lint.exists():
              doc = yaml.safe_load(lint.read_text()) or {}
              if privileged(doc):
                  problems.append(
                      "lint.yml must remain unprivileged (no self-hosted runner, no "
                      "environment, no secrets): " + "; ".join(privileged(doc))
                  )
              if "pull_request_target" in triggers(doc):
                  problems.append("lint.yml must not use pull_request_target")

          # deploy.yml must be workflow_dispatch + push only.
          deploy = pathlib.Path(".github/workflows/deploy.yml")
          if deploy.exists():
              got = triggers(yaml.safe_load(deploy.read_text()) or {})
              if got - {"workflow_dispatch", "push"}:
                  problems.append(
                      f"deploy.yml triggers must be workflow_dispatch + push only, got {sorted(got)}"
                  )
          else:
              problems.append("deploy.yml is missing")

          if problems:
              print()
              for p in problems:
                  print(f"::error title=trigger rules::{p}")
              sys.exit(1)
          print("\nOK: no privileged workflow is reachable from a pull request")
          PY

  # ---------------------------------------------------------------------------
  workflows:
    name: actionlint + yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install actionlint
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/actionlint.tgz "$url"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      # actionlint shells out to shellcheck for every `run:` block, which is
      # preinstalled on ubuntu-latest.
      - name: actionlint
        run: actionlint -color

      - name: yamllint
        run: |
          set -euo pipefail
          pipx install yamllint >/dev/null 2>&1 || pip install --quiet yamllint
          # The Helm values files and the token files are envsubst templates, so
          # `${VAR}` appears inside quoted scalars -- that is valid YAML.
          yamllint --strict --config-file .yamllint.yml \
            .github/workflows .github/actions helm teleport

  # ---------------------------------------------------------------------------
  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: shellcheck scripts/
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck --severity=style --shell=bash scripts/*.sh

      # The Terraform user-data templates are shell scripts with Terraform
      # interpolations in them. Replace the interpolations with harmless
      # placeholders, un-escape `$${...}` back to `${...}`, and drop the
      # `%{ if }` / `%{ endif }` / `%{ for }` directives so shellcheck sees plain
      # bash. A syntax error in user-data is otherwise only discovered by reading
      # the console log of a booted instance.
      - name: shellcheck the user-data templates
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          status=0
          while IFS= read -r tpl; do
            out="/tmp/rendered/$(echo "$tpl" | tr '/' '_').sh"
            python3 - "$tpl" "$out" <<'PY'
          import re
          import sys

          src, dst = sys.argv[1], sys.argv[2]
          text = open(src).read()

          # Drop Terraform template directives (%{ if ... } / %{ endif } / %{ for ... }).
          text = re.sub(r"%\{[^}]*\}\n?", "", text)

          # `$${foo}` is a literal shell expansion -> restore it, protecting it from
          # the interpolation substitution below.
          text = text.replace("$${", "\x00{")

          # Any remaining `${foo}` is a Terraform interpolation -> placeholder.
          text = re.sub(r"\$\{[^}]*\}", "TF_PLACEHOLDER", text)

          text = text.replace("\x00{", "${")

          open(dst, "w").write(text)
          print(f"{src} -> {dst}")
          PY
            shellcheck --severity=style --shell=bash "$out" || status=1
          done < <(find terraform -name '*.sh.tftpl' -print | sort)
          exit "$status"

  # ---------------------------------------------------------------------------
  helm:
    name: helm lint + ServiceAccount cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned helm
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./tool-versions.env
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      # Fixture values: the real templates from helm/, rendered with placeholder
      # values. The thing under test is therefore exactly what deploy.yml uses,
      # not a hand-maintained copy that can drift.
      #
      # vars.TELEPORT_VERSION is a repository *variable*, not a secret, so it is
      # readable from a pull-request run. If it is unset we fall back to the newest
      # published chart so the templates still get exercised.
      - name: helm lint + helm template
        env:
          TELEPORT_CLUSTER_NAME: teleport.ci.example.com
          ACME_EMAIL: infra@example.com
          ACME_URI: ''
          KUBE_CLUSTER_NAME: ci-k8s
          CHART_VERSION: ${{ vars.TELEPORT_VERSION }}
        run: |
          set -euo pipefail
          version="${CHART_VERSION:-}"
          if [ -z "$version" ]; then
            echo "::notice title=helm::vars.TELEPORT_VERSION is unset; linting against the latest published chart"
          fi

          helm repo add teleport "$HELM_REPO_URL"
          helm repo update teleport

          mkdir -p /tmp/fixtures
          # envsubst takes its variable list as literal $NAME tokens.
          # shellcheck disable=SC2016
          envsubst '$TELEPORT_CLUSTER_NAME $ACME_EMAIL $ACME_URI' \
            <helm/teleport-cluster.values.yaml >/tmp/fixtures/cluster.yaml
          # envsubst takes its variable list as literal $NAME tokens.
          # shellcheck disable=SC2016
          envsubst '$TELEPORT_CLUSTER_NAME $KUBE_CLUSTER_NAME' \
            <helm/teleport-kube-agent.values.yaml >/tmp/fixtures/agent.yaml

          # Every ${VAR} must have been substituted.
          # shellcheck disable=SC2016
          if grep -n '\${' /tmp/fixtures/cluster.yaml /tmp/fixtures/agent.yaml; then
            echo "::error title=helm::unsubstituted template variables remain in the rendered values. Add them to the envsubst variable list in deploy.yml and here."
            exit 1
          fi

          chart_args=()
          if [ -n "$version" ]; then chart_args=(--version "$version"); fi

          helm pull teleport/teleport-cluster "${chart_args[@]}" --untar --untardir /tmp/charts
          helm pull teleport/teleport-kube-agent "${chart_args[@]}" --untar --untardir /tmp/charts

          helm lint /tmp/charts/teleport-cluster -f /tmp/fixtures/cluster.yaml
          helm lint /tmp/charts/teleport-kube-agent -f /tmp/fixtures/agent.yaml

          helm template teleport-cluster /tmp/charts/teleport-cluster \
            -n teleport -f /tmp/fixtures/cluster.yaml >/tmp/rendered-cluster.yaml
          helm template teleport-kube-agent /tmp/charts/teleport-kube-agent \
            -n teleport-agent -f /tmp/fixtures/agent.yaml >/tmp/rendered-agent.yaml
          echo "rendered $(grep -c '^kind:' /tmp/rendered-cluster.yaml) cluster objects and $(grep -c '^kind:' /tmp/rendered-agent.yaml) agent objects"

          # ACME requires exactly one replica.
          replicas="$(grep -E '^[[:space:]]*replicas:' /tmp/rendered-cluster.yaml | awk '{print $2}' | sort -u | tr '\n' ' ')"
          echo "cluster replica counts: $replicas"
          if grep -qE '^[[:space:]]*replicas: [2-9]' /tmp/rendered-cluster.yaml; then
            echo "::error title=helm::more than one replica rendered, but ACME in teleport-cluster is single-pod only (SPEC.md §2.1)."
            exit 1
          fi

          # SPEC.md §6.1: the chart's ServiceAccount name must equal the
          # service_account the kubernetes join token allows, or the agent is
          # rejected at join time. This is the cross-check that catches a chart
          # bump on the PR instead of at deploy time.
          sa_name="$(awk '/^kind: ServiceAccount$/{k=1} k && /^  name:/{print $2; exit}' /tmp/rendered-agent.yaml)"
          expected="$(grep -o 'service_account:[[:space:]]*"[^"]*"' teleport/tokens/kube-agent-token.yaml |
            head -n1 | sed 's/.*"\(.*\)"/\1/' | awk -F: '{print $NF}')"
          echo "rendered ServiceAccount: '$sa_name'"
          echo "token allows:            '$expected'"
          if [ -z "$sa_name" ] || [ -z "$expected" ] || [ "$sa_name" != "$expected" ]; then
            echo "::error title=helm::ServiceAccount mismatch between the teleport-kube-agent chart ('$sa_name') and teleport/tokens/kube-agent-token.yaml ('$expected')."
            exit 1
          fi

          # insecureSkipProxyTLSVerify must stay false (SPEC.md §6.1, §10).
          if grep -qE '^[[:space:]]*insecureSkipProxyTLSVerify:[[:space:]]*true' helm/teleport-kube-agent.values.yaml; then
            echo "::error title=helm::insecureSkipProxyTLSVerify must stay false."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned terraform
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./tool-versions.env
          curl -fsSL -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          unzip -q -o /tmp/terraform.zip -d /tmp
          sudo install -m 0755 /tmp/terraform /usr/local/bin/terraform
          terraform version

      - name: terraform fmt -check -recursive
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (stub backend)
        run: |
          set -euo pipefail
          for module in terraform/ec2-agent terraform/runner-bootstrap; do
            echo "== $module"
            # -backend=false: no credentials, no state bucket, nothing to lock.
            terraform -chdir="$module" init -input=false -backend=false
            terraform -chdir="$module" validate
          done
