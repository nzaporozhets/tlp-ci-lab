version: v2
proxy_server: nzaporozhets.cloud.gravitational.io:443
onboarding:
  join_method: github
  token: github-bot
certificate_ttl: 20m
storage:
  type: memory
services:
  - type: kubernetes/v2
    selectors:
      - name: certlab
      - labels:
          env: certlab
    destination:
      type: directory
      path: "${RUNNER_TEMP}/machine-id"
